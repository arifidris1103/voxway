<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Garage</title>
  <style>
    :root { --bg: #b9b9bb; --panel: #1d2026; --ink: #e9ecf1; --muted: #9aa3ae; --accent: #ffb341; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); }
    #app { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }
    #app.withref { grid-template-columns: 240px minmax(0, 1fr) minmax(0, 1fr); }
    aside { background: var(--panel); overflow: auto; padding: 12px; }
    aside h1 { font-size: 15px; margin: 0 0 4px; }
    aside p { color: var(--muted); margin: 0 0 12px; font-size: 12px; }
    aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; }
    aside button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 5px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
    aside button:hover { background: #2b3038; }
    aside button.on { background: var(--accent); color: #1b1b1b; }
    #views { display: flex; gap: 6px; flex-wrap: wrap; }
    #views button { width: auto; background: #2b3038; }
    #views button.on { background: var(--accent); }
    #stage { position: relative; min-width: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #label { position: absolute; left: 16px; bottom: 12px; color: #2a2d33; font-weight: 600; letter-spacing: .04em; }
    #ref { height: 100%; min-width: 0; background: var(--bg); display: none; }
    #ref.on { display: block; }
    #ref img { width: 100%; height: 100%; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>Voxel Garage</h1>
      <p>Every asset is a MagicaVoxel .vox file rendered with three.js. <a href="index.html" style="color:#ffb341">← back to the simulator</a></p>
      <div id="views"></div>
      <div id="list"></div>
    </aside>
    <div id="stage"><div id="label"></div></div>
    <div id="ref"><img alt="reference" /></div>
  </div>
  <script type="module" src="./src/garage.js"></script>
</body>
</html>
