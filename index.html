<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel AV Sim</title>
  <link rel="stylesheet" href="./src/ui/voxway.css" />
</head>
<body>
  <canvas id="view"></canvas>
  <div id="loading"><img src="./src/assets/voxway-logo.svg" alt="VOXWAY" width="440" height="81" /><p>Building the city…</p></div>
  <div id="toast" class="vx md vx-yellow"></div>
  <h1 id="brand"><img src="./src/assets/voxway-logo.svg" alt="VOXWAY" width="300" height="55" /></h1>

  <section id="av" class="vx">
    <div class="hud-top">
      <div id="speedbox"><span id="speed">0</span><small>km/h</small></div>
      <div id="state" class="vx sm">CRUISE</div>
    </div>
    <div id="reason"></div>
    <div id="target" class="vx sm vx-yellow"></div>
    <div id="stats"></div>
    <div id="meta">
      <div><i>Cam</i><b id="cam"></b><i>Car</i><b id="car"></b></div>
      <div><i>Seed</i><b id="seed"></b></div>
      <div><i>Model</i><b id="predictor"></b></div>
    </div>
  </section>

  <button id="pausebtn" class="vx md btn" type="button" title="Pause menu: all the controls">
    <span class="pause-icon"></span>Menu<kbd class="vx sm vx-white">Esc</kbd>
  </button>
  <section id="mapwrap" class="vx md"><canvas id="minimap" width="400" height="400"></canvas></section>

  <div id="menu" hidden>
    <div class="menu-card vx" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <header class="menu-head">
        <img id="menu-title" src="./src/assets/paused.svg" alt="PAUSED" width="250" height="53" />
        <p>Esc or Space to resume</p>
      </header>
      <div class="menu-body">
        <section class="kb-col">
          <h2>Keyboard</h2>
          <div id="kb"></div>
          <p class="kb-note">Yellow keys do something. Hover a control to find its key.</p>
          <div id="mouse"></div>
        </section>
        <section>
          <h2>Controls</h2>
          <div id="controls"></div>
        </section>
      </div>
      <footer class="menu-foot">
        <a class="vx md btn vx-white" href="garage.html">Voxel garage</a>
        <button id="resume" class="vx md btn vx-yellow" type="button"><span class="play-icon"></span>Resume</button>
      </footer>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
